<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this file for any unknown path. Because the app uses
      // a HashRouter, we simply send the visitor to the app root and let the
      // client-side router handle the rest.
      var base = '/prabir-das-academic-website/';
      location.replace(base + '#' + location.pathname.replace(base, '/') + location.search);
    </script>
    <meta http-equiv="refresh" content="0; url=/prabir-das-academic-website/" />
  </head>
  <body>
    <p>Redirecting to <a href="/prabir-das-academic-website/">the homepage</a>…</p>
  </body>
</html>
